name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Scan hebdo même sans activité (CVE bases images / distro)
    - cron: "0 6 * * 1"

permissions:
  contents: read

env:
  # Aligné avec le Dockerfile (stage builder)
  GO_VERSION: "1.24"

jobs:
  go:
    name: Go (test, vet, govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - run: go mod download
      - run: go mod verify

      - run: go vet ./...
      - run: go test ./... -race -count=1

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  trivy-fs:
    name: Trivy (fichiers & IaC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  trivy-image:
    name: Trivy (image Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        run: docker build -t bentext:ci .

      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: bentext:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
