name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Scan hebdo même sans activité (CVE bases images / distro)
    - cron: "0 6 * * 1"

permissions:
  contents: read

env:
  # On suit la dernière release stable de Go côté CI pour récupérer
  # automatiquement les correctifs de la stdlib (cf. govulncheck).
  GO_VERSION: "stable"

jobs:
  go:
    name: Go (test, vet, govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - run: go mod download
      - run: go mod verify

      - run: go vet ./...
      - run: go test ./... -race -count=1

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  trivy-fs:
    name: Trivy (fichiers & IaC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  trivy-image:
    name: Trivy (image Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        run: docker build -t bentext:ci .

      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: bentext:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
